<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b2f14">
<title>Fil d'Or : atelier de couture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" type="image/png" href="fo-favicon-32.png">
<link rel="apple-touch-icon" href="fo-apple-touch.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fil d'Or">
<meta name="description" content="Gestion d'atelier de couture : clients, mesures, photos de modèles, acomptes, reçus, rappels WhatsApp. Fonctionne sans connexion.">
<style>
:root{
  --indigo:#7b2f14; --indigo-2:#985d48; --ochre:#e3a32b; --ochre-soft:#efce90; --terra:#b5482a;
  --rb:10px 3px 10px 3px; --rc:12px 3px 12px 3px; --ri:3px 16px 16px 3px;
  --cream:#f6e6d0; --paper:#fffaf2; --ink:#2a1a12; --muted:#7a6552; --line:#e6d2b4; --green:#1f7a4d;
  --tint:123,47,20; --on-accent:#1a1a1a;
  --st-wait:#9a6700; --st-wait-bg:#fbefd2; --st-prog:#2a6fb0; --st-prog-bg:#dfeaf7;
  --st-ready:#1f7a4d; --st-ready-bg:#dcf1e5; --st-done:#6b6559; --st-done-bg:#e8e6e1;
  --st-late:#b5482a; --st-late-bg:#f9e0d9;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:92px;
  background-color:var(--cream);
  background-image:
    linear-gradient(135deg,rgba(var(--tint),.05) 25%,transparent 25%),
    linear-gradient(225deg,rgba(var(--tint),.05) 25%,transparent 25%),
    linear-gradient(45deg,rgba(var(--tint),.05) 25%,transparent 25%),
    linear-gradient(315deg,rgba(var(--tint),.05) 25%,var(--cream) 25%);
  background-size:30px 30px;background-position:15px 0,15px 0,0 0,0 0;
}

body.nomotif{background-image:none}
body.shape-rond{--rb:999px; --rc:18px; --ri:6px 22px 22px 6px}
body.shape-droit{--rb:4px; --rc:4px; --ri:3px}
body.notape .tape{display:none}
body.nostitch .item::before,body.nostitch .item::after{display:none}
body.nostitch .item{padding-left:16px}
/* ===== En-tête : logo, atelier, profil, mètre ruban ===== */
.topwrap{position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(var(--tint),.25)}
.top{background:var(--indigo);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#logo{width:44px;height:44px;flex:none;display:block;border-radius:50%;box-shadow:0 0 0 2px var(--ochre),0 0 0 4px rgba(241,217,160,.35)}
#logo svg{width:100%;height:100%;display:block}
.brand h1{margin:0;font:700 1.2rem/1.1 var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--ochre-soft);font-size:.74rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;cursor:pointer;flex:none}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--ochre);background:var(--ochre-soft);color:var(--indigo);display:grid;place-items:center;overflow:hidden;font:700 .95rem var(--serif)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:60%;height:60%}
.me .nm{font-size:.68rem;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ochre-soft)}
.tape{height:16px;background:
  linear-gradient(90deg,#3b2f1e 1px,transparent 1px) 0 100%/8px 6px repeat-x,
  linear-gradient(90deg,#3b2f1e 1px,transparent 1px) 0 100%/40px 12px repeat-x,
  var(--ochre)}

main{max-width:720px;margin:0 auto;padding:14px 16px}

/* ===== Titres de section avec point de couture ===== */
.sec{display:flex;align-items:center;gap:10px;font:700 1.02rem var(--serif);color:var(--indigo);margin:16px 0 8px}
.sec::after{content:"";flex:1;border-top:2px dashed var(--ochre)}
h3{font:700 1.02rem var(--serif);color:var(--indigo);margin:18px 0 6px}

/* ===== Statistiques ===== */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--rc);padding:10px 6px;text-align:center;position:relative}
.stat b{display:block;font:700 1.2rem var(--serif);color:var(--indigo)}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.bad b{color:var(--terra)} .stat.warn b{color:#9a6a00}

/* ===== Filtres ===== */
.chips{display:flex;flex-wrap:wrap;gap:12px 8px;padding:6px 6px 8px;margin:0 -6px 6px}
.chip{--c:var(--indigo);display:inline-flex;align-items:center;gap:7px;border:none;background:var(--c);color:#fff;border-radius:var(--rb);padding:9px 13px;font-size:.88rem;font-weight:600;white-space:nowrap;cursor:pointer;flex:1 1 auto;justify-content:center}
.chip[data-f="En attente"]{--c:var(--st-wait)}
.chip[data-f="En cours"]{--c:var(--st-prog)}
.chip[data-f="Prêt"]{--c:var(--st-ready)}
.chip[data-f="Livré"]{--c:var(--st-done)}
.chip .n{font-size:.74rem;background:rgba(255,255,255,.24);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.chip.on{box-shadow:0 0 0 2px var(--cream),0 0 0 4px var(--c);font-weight:800}
.chip.on::before{content:"✓";font-weight:800}

/* ===== Fiche de commande : étiquette de tailleur ===== */
.list{display:flex;flex-direction:column;gap:10px}
.item{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:7px solid var(--ochre);border-radius:var(--ri);padding:14px 14px 14px 30px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.item::before{content:"";position:absolute;left:8px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--cream);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.item::after{content:"";position:absolute;inset:5px 5px 5px 2px;border:1.5px dashed rgba(var(--tint),.22);border-radius:2px 12px 12px 2px;pointer-events:none}
.item[data-s="En attente"]{border-left-color:var(--st-wait)}
.item[data-s="En cours"]{border-left-color:var(--st-prog)}
.item[data-s="Prêt"]{border-left-color:var(--st-ready)}
.item[data-s="Livré"]{border-left-color:var(--st-done)}
.ithumb{width:54px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:#fbf5e6}
.ibody{flex:1;min-width:0}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .r1 .who{font:700 1.02rem var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r2{color:var(--muted);font-size:.9rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r3{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:8px;font-size:.86rem}
.reste{font-weight:700;color:var(--indigo)}
.reste.ok{color:var(--green)}


.empty{text-align:center;color:var(--muted);padding:30px 8px}

/* ===== Formulaires : lignes de registre ===== */
input,select,textarea{width:100%;padding:11px 10px;border:none;border-bottom:2px solid var(--line);border-radius:6px 6px 0 0;font:inherit;background:rgba(255,255,255,.75);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ochre);background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.76rem;color:var(--muted);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
button{font:inherit;cursor:pointer;border-radius:var(--rb);border:1.5px solid var(--indigo-2);background:transparent;color:var(--indigo);padding:10px 14px}
button.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);border-bottom:3px solid var(--ochre);font-weight:700}
button.danger{color:var(--terra);border-color:var(--terra)}
a.btn{display:inline-block;text-decoration:none;border-radius:var(--rb);padding:10px 14px;border:1.5px solid var(--indigo-2);color:var(--indigo);background:transparent}
a.btn.wa{background:#1f7a4d;color:#fff;border-color:#1f7a4d;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
/* paiements et reçus */
.pay{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pay .pl{flex:1;min-width:0;display:flex;flex-direction:column}
.pay .pl span{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.pay .pshot{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
button.mini{padding:6px 10px;font-size:.85rem}
.shotrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.shotrow img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sw .dots{display:grid;place-items:center;overflow:hidden;font:700 1.3rem var(--serif);color:var(--indigo)}
.sw .dots svg,.sw .dots img{width:100%;height:100%;display:block;object-fit:cover}
.rimg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.jobs button{padding:18px 8px;font:700 1.05rem var(--serif);text-align:center}

/* ===== Bouton + Commande : bouton de couture ===== */
.fab{position:fixed;right:16px;bottom:86px;display:flex;align-items:center;gap:8px;background:var(--ochre);color:var(--on-accent);border:none;border-radius:999px;padding:12px 20px 12px 14px;font-weight:800;box-shadow:0 5px 16px rgba(var(--tint),.35);z-index:6;outline:2px dashed rgba(var(--tint),.6);outline-offset:-5px}
.fab i{font:700 1.5rem/1 var(--serif);width:26px;height:26px;border-radius:50%;background:var(--on-accent);color:var(--ochre);display:grid;place-items:center;font-style:normal}

/* ===== Tableau de bord & Caisse ===== */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 12px}
.hello h2{margin:0;font:700 1.55rem/1.1 var(--serif);color:var(--ink)}
.hello small{display:block;font:600 .78rem var(--sans,inherit);color:var(--muted);text-transform:capitalize;margin-top:3px}
.cash{display:block;width:100%;text-align:left;border:none;cursor:pointer;color:#fff;border-radius:var(--rc);padding:16px 18px 15px;margin:0 0 12px;
  background:linear-gradient(135deg,var(--indigo) 0%,var(--indigo-2) 140%);position:relative;overflow:hidden;box-shadow:0 6px 16px rgba(var(--tint),.28)}
.cash::after{content:"";position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;border:14px solid rgba(255,255,255,.08)}
.cash .k{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.cash .k svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cash .v{font:700 1.9rem/1.15 var(--serif);margin:6px 0 10px;letter-spacing:.01em}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;min-width:6px;border-radius:99px;background:var(--ochre);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
.cash .s{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-top:8px;opacity:.92}
.cash.big .v{font-size:2.3rem}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini div{background:var(--paper);border:1px solid var(--line);border-radius:var(--rc);padding:11px 12px}
.mini b{display:block;font:700 1.12rem var(--serif);color:var(--indigo)}
.mini span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.mrow button{border:1px solid var(--line);background:var(--paper);border-radius:99px;width:40px;height:40px;font:700 1.2rem var(--serif);color:var(--indigo);cursor:pointer}
.mrow button:disabled{opacity:.35}
.mrow b{font:700 1.05rem var(--serif);text-transform:capitalize;color:var(--ink)}
.mode{margin:0 0 10px}
.mode .t{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;margin-bottom:4px}
.mode .t span:last-child{font-family:var(--serif);color:var(--indigo)}
.mode .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mode .b i{display:block;height:100%;border-radius:99px;background:var(--ochre)}
.pay{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--ri);padding:10px 12px;margin:0 0 8px;cursor:pointer}
.pay .a{font:700 1.02rem var(--serif);color:var(--green);white-space:nowrap}
.pay .w{flex:1;min-width:0}
.pay .w b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .w span{font-size:.78rem;color:var(--muted)}

/* ===== Navigation basse ===== */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px dashed var(--ochre);display:flex;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;border-radius:0;background:none;padding:9px 4px 8px;color:var(--muted);font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--indigo);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:var(--ochre);border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--indigo)}

/* ===== Fenêtres : bord festonné ===== */
.overlay{position:fixed;inset:0;background:rgba(20,24,50,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--paper);width:100%;max-width:720px;margin-top:24px}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;background:radial-gradient(circle at 8px 10px,var(--paper) 0 8px,transparent 8.5px) 0 0/16px 10px repeat-x}
.sheet-in{max-height:90vh;overflow:auto;padding:16px 16px 22px}
.sheet h2{margin:0 28px 6px 0;font:700 1.2rem var(--serif);color:var(--indigo)}
.sheet .x{position:absolute;right:8px;top:6px;border:none;font-size:1.6rem;padding:2px 10px;background:none;color:var(--indigo)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--indigo);color:#fff;padding:10px 16px;border-radius:var(--rb);z-index:40;font-size:.9rem;border-bottom:3px solid var(--ochre);max-width:90vw}

/* ===== Photos du modèle ===== */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.ptile{position:relative;aspect-ratio:3/4;border:2px dashed var(--ochre);border-radius:10px;background:#fbf5e6;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--ochre)}
.ptile.has{border-style:solid;border-color:var(--indigo)}
.ptile.busy{opacity:.5;pointer-events:none}
.ptile svg{width:44%;height:auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plab{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:.62rem;padding:3px 2px;background:rgba(31,42,92,.88);color:#fff;letter-spacing:.03em}
.pbtn{position:absolute;top:4px;width:22px;height:22px;border-radius:50%;border:none;padding:0;font-size:.85rem;line-height:22px;text-align:center;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pbtn.rm{right:4px;background:var(--terra)}
.pbtn.rp{left:4px;background:var(--indigo)}
.lightbox{position:fixed;inset:0;background:rgba(10,12,30,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:8px;border:2px solid var(--ochre-soft)}
.lightbox span{color:var(--ochre-soft);font:700 1rem var(--serif)}

/* ===== Profil ===== */
.pro{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px}
.pro .av{width:92px;height:92px;font-size:1.8rem;border-width:3px}
.pro .who{font:700 1.15rem var(--serif);color:var(--indigo);text-align:center}
.pro .sub{color:var(--muted);font-size:.85rem;text-align:center}

/* ===== Étiquettes de statut : sobres ===== */
.tag{--c:var(--muted);--cb:var(--line);display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.01em;line-height:1.2;padding:4px 9px;border-radius:6px;color:var(--c);background:var(--cb);white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.tag[data-s="En attente"]{--c:var(--st-wait);--cb:var(--st-wait-bg)}
.tag[data-s="En cours"]{--c:var(--st-prog);--cb:var(--st-prog-bg)}
.tag[data-s="Prêt"]{--c:var(--st-ready);--cb:var(--st-ready-bg)}
.tag[data-s="Livré"]{--c:var(--st-done);--cb:var(--st-done-bg)}
.tag.late{background:var(--st-late);color:#fff}
.tag.neutral{font-weight:600}

/* ===== Thème : palettes et fonds ===== */
.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1.5px solid var(--line);border-radius:var(--rb);background:var(--paper);font-size:.78rem;color:var(--ink)}
.sw .dots{width:34px;height:34px;border-radius:50%;display:block}
.sw.on{border-color:var(--indigo);box-shadow:inset 0 0 0 2px var(--indigo);font-weight:700}
.sw.on span:last-child::before{content:"✓ "}
input[type=color]{padding:3px;height:44px;cursor:pointer}
.updatebar{position:fixed;left:12px;right:12px;bottom:148px;z-index:45;background:var(--indigo);color:#fff;border-radius:var(--rc);border-bottom:3px solid var(--ochre);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.88rem;box-shadow:0 6px 18px rgba(var(--tint),.4)}
.updatebar .btns{display:flex;gap:6px;flex:none}
.updatebar button{background:var(--ochre);color:var(--on-accent);border:none;font-weight:700;padding:8px 12px;white-space:nowrap}
.updatebar button.later{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);font-weight:600}
.pwa-ok{color:var(--green);font-weight:700}
/* ===== Reçu imprimable ===== */
#receipt{display:none}
@media print{
  body{background:#fff;padding:0}
  .topwrap,main,nav.tabs,.fab,.overlay,.toast,.lightbox,.updatebar{display:none!important}
  #receipt{display:block!important;font:14px/1.5 system-ui,Arial,sans-serif;padding:24px;max-width:600px;margin:0 auto;color:#111}
  #receipt .rh{display:flex;gap:14px;align-items:center;border-bottom:3px double var(--indigo);padding-bottom:12px;margin-bottom:14px}
  #receipt .rh svg{width:64px;height:64px}
  #receipt h2{margin:0;font:700 1.4rem Georgia,serif;color:var(--indigo)}
  #receipt .kv{border-bottom:1px solid #ccc}
  #receipt .rp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  #receipt .rp div{text-align:center;font-size:.7rem}
  #receipt .rp img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #999}
}
</style>
</head>
<body>

<div class="topwrap">
  <div class="top">
    <div class="brand"><span id="logo"></span><div><h1 id="shopTitle">Fil d'Or</h1><small id="subTitle">Atelier de couture</small></div></div>
    <button class="me" id="me" type="button" aria-label="Mon profil"></button>
  </div>
  <div class="tape"></div>
</div>

<main id="view"></main>

<button class="fab" id="fab" type="button" aria-label="Nouvelle commande"><i>+</i>Commande</button>

<nav class="tabs" id="tabs">

<script>
(function(){
"use strict";

/* ===== BEGIN-PURE : fonctions testables ===== */
var STATUSES = ["En attente","En cours","Prêt","Livré"];
var CUR = { XOF:{sym:"FCFA",dec:0}, XAF:{sym:"FCFA",dec:0}, CDF:{sym:"FC",dec:0}, USD:{sym:"$",dec:2}, EUR:{sym:"€",dec:2} };
function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
function money(n, cur){
  var c = CUR[cur] || CUR.XOF;
  return new Intl.NumberFormat("fr-FR",{minimumFractionDigits:c.dec,maximumFractionDigits:c.dec}).format(n) + " " + c.sym;
}
function paidOf(o){ return (o.payments||[]).reduce(function(s,p){ return s + num(p.amount); }, 0); }
function balanceOf(o){ return Math.max(0, num(o.price) - paidOf(o)); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(iso, n){ var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fdate(iso){ if(!iso) return "—"; var p=iso.split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function isLate(o, today){ return !!o.due && o.status !== "Livré" && o.due < today; }
function isSoon(o, today){ return !!o.due && o.status !== "Livré" && o.due >= today && o.due <= addDays(today,7); }
function waLink(phone, text, cc){
  var raw = String(phone||"").trim();
  var d = raw.replace(/\D/g,"");
  if(!d) return "";
  if(raw.charAt(0) === "+") { /* déjà international */ }
  else if(d.slice(0,2) === "00") d = d.slice(2);
  else if(d.charAt(0) === "0") d = String(cc||"").replace(/\D/g,"") + d.slice(1);
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(text||"");
}
function summarize(orders, today){
  var late=0, soon=0, due=0;
  orders.forEach(function(o){
    if(isLate(o,today)) late++;
    if(isSoon(o,today)) soon++;
    due += balanceOf(o);
  });
  return {late:late, soon:soon, due:due};
}
function initials(name){
  var parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "";
  return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length-1].charAt(0) : "")).toUpperCase();
}
function photoIds(orders, profile){
  var ids = [];
  (orders||[]).forEach(function(o){
    var p = o.photos || {}; Object.keys(p).forEach(function(k){ if(p[k]) ids.push(p[k]); });
    (o.payments||[]).forEach(function(pm){ if(pm && pm.shot) ids.push(pm.shot); });
  });
  if(profile && profile.photo) ids.push(profile.photo);
  if(profile && profile.logoPhoto) ids.push(profile.logoPhoto);
  return ids;
}

function hexToRgb(h){ var m = /^#?([0-9a-f]{6})$/i.exec(String(h||"").trim()); if(!m) return null; var n = parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r){ return "#"+r.map(function(v){ v = Math.max(0,Math.min(255,Math.round(v))); return (v<16?"0":"")+v.toString(16); }).join(""); }
function mixHex(a,b,t){ var A = hexToRgb(a), B = hexToRgb(b); if(!A||!B) return a; return rgbToHex([0,1,2].map(function(i){ return A[i]+(B[i]-A[i])*t; })); }
function lum(hex){ var c = hexToRgb(hex); if(!c) return 0; var l = c.map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*l[0]+0.7152*l[1]+0.0722*l[2]; }
function contrast(a,b){ var x = lum(a), y = lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function darkEnough(hex){ var c = hex, i = 0; while(contrast(c,"#ffffff") < 4.5 && i < 25){ c = mixHex(c,"#000000",0.12); i++; } return c; }
function readableOn(hex){ return contrast(hex,"#ffffff") >= contrast(hex,"#1a1a1a") ? "#ffffff" : "#1a1a1a"; }
function buildTheme(t){
  t = t || {};
  var main = darkEnough(hexToRgb(t.main) ? t.main : DEFAULT_THEME.main);
  var acc = hexToRgb(t.accent) ? t.accent : DEFAULT_THEME.accent;
  var bg = BGS[t.bg] || BGS.sable;
  return {"--indigo":main, "--indigo-2":mixHex(main,"#ffffff",0.22), "--ochre":acc, "--ochre-soft":mixHex(acc,"#ffffff",0.55),
    "--on-accent":readableOn(acc), "--tint":hexToRgb(main).join(","), "--cream":bg.cream, "--paper":bg.paper, "--line":bg.line, "--ink":bg.ink, "--muted":bg.muted};
}
function daysLate(o, today){
  if(!isLate(o,today)) return 0;
  var a = o.due.split("-"), b = today.split("-");
  return Math.round((Date.UTC(+b[0],+b[1]-1,+b[2]) - Date.UTC(+a[0],+a[1]-1,+a[2]))/86400000);
}

function load(){
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return;
    var d = JSON.parse(raw);
    if(d && Array.isArray(d.clients) && Array.isArray(d.orders)){
      state.clients = d.clients; state.orders = d.orders;
      if(d.settings) state.settings = Object.assign(state.settings, d.settings);

/* ---------- Stockage des photos (IndexedDB) ---------- */
var dbp = null;
function idb(){
  if(dbp) return dbp;
  dbp = new Promise(function(res){
    try{
      var r = indexedDB.open("fildor_img", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("img"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ res(null); };
      r.onblocked = function(){ res(null); };
    }catch(e){ res(null); }
  });
  return dbp;
}
function idbRun(mode, fn){
  return idb().then(function(db){
    if(!db) return undefined;
    return new Promise(function(res){
      try{
        var tx = db.transaction("img", mode), st = tx.objectStore("img"), out;
        out = fn(st);
        tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : undefined); };
        tx.onerror = tx.onabort = function(){ res(undefined); };
      }catch(e){ res(undefined); }
    });
  });
}
function idbPut(k, v){ return idbRun("readwrite", function(s){ return s.put(v, k); }); }
function idbGet(k){ return idbRun("readonly", function(s){ return s.get(k); }); }
function idbDel(k){ return idbRun("readwrite", function(s){ return s.delete(k); }); }
function idbEntries(){
  return idb().then(function(db){
    if(!db) return [];
    return new Promise(function(res){
      var out = [];
      try{
        var c = db.transaction("img","readonly").objectStore("img").openCursor();
        c.onsuccess = function(){ var cur = c.result; if(cur){ out.push([cur.key, cur.value]); cur.continue(); } else res(out); };
        c.onerror = function(){ res(out); };
      }catch(e){ res(out); }
    });
  });
}

function processImage(file, maxSide, quality, square){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, hgt = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = hgt;
      if(square){ var s = Math.min(w,hgt); sx = (w-s)/2; sy = (hgt-s)/2; sw = s; sh = s; }

    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else if(k === "value") after.value = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v === true ? "" : v);

function wrapText(ctx, text, maxW){
  var words = String(text||"").split(/\s+/).filter(Boolean), lines = [], cur = "";
  words.forEach(function(w){
    var t = cur ? cur + " " + w : w;
    if(cur && ctx.measureText(t).width > maxW){ lines.push(cur); cur = w; } else cur = t;
  });
  if(cur) lines.push(cur);
  return lines;
}

    var SER = 'Georgia, "Times New Roman", serif', SAN = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

      ctx.fillText(pm ? "REÇU DE PAIEMENT" : "SITUATION DE LA COMMANDE", pad, y);
      ctx.textAlign = "right"; ctx.fillStyle = MUTED; ctx.font = "600 20px " + SAN;
      var no = "N° " + orderNo(o) + (pm ? "-" + (pays.indexOf(pm) + 1) : "");
      ctx.fillText(no, W - pad, y - 6);
      ctx.font = "400 19px " + SAN;
      ctx.fillText(fdate(pm ? pm.date : todayISO()), W - pad, y + 18);
      y += 56;

      function dash(yy){ ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke(); ctx.restore(); }
      function row(label, value, bold, color){
        ctx.textAlign = "left"; ctx.fillStyle = MUTED; ctx.font = "400 21px " + SAN; ctx.fillText(label, pad, y);
        ctx.textAlign = "right"; ctx.fillStyle = color || INK; ctx.font = (bold ? "700 " : "400 ") + "23px " + SAN; ctx.fillText(value, W - pad, y, W - pad*2 - 190);
        dash(y + 16); y += 48;
      }
      row("Client", c ? c.name : "—", true);
      if(c && c.phone) row("Téléphone", c.phone, false);
      ctx.textAlign = "left"; ctx.fillStyle = MUTED; ctx.font = "400 21px " + SAN; ctx.fillText("Commande", pad, y); y += 32;
      ctx.fillStyle = INK; ctx.font = "400 24px " + SAN;
      wrapText(ctx, o.desc || "—", W - pad*2).forEach(function(line){ ctx.fillText(line, pad, y); y += 32; });
      dash(y - 8); y += 26;
      if(o.due) row("Livraison prévue", fdate(o.due), false);
      row("Prix total", cm(num(o.price)), true);

      y += 4;
      ctx.textAlign = "left"; ctx.fillStyle = main; ctx.font = "700 22px " + SER; ctx.fillText("Paiements", pad, y); y += 34;
      if(!pays.length){ ctx.fillStyle = MUTED; ctx.font = "italic 21px " + SAN; ctx.fillText("Aucun paiement enregistré.", pad, y); y += 40; }
      pays.forEach(function(x, i){
        var hl = x === pm, hasRef = !!x.ref, h2 = hasRef ? 74 : 48;
        if(hl){ ctx.fillStyle = "rgba(217,154,30,.20)"; ctx.fillRect(pad - 12, y - 28, W - pad*2 + 24, h2 - 6); }
        ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = (hl ? "700 " : "400 ") + "21px " + SAN;
        ctx.fillText(fdate(x.date) + "  ·  " + (x.mode || "Espèces"), pad, y, W - pad*2 - 200);
        if(hasRef){ ctx.fillStyle = MUTED; ctx.font = "400 17px " + SAN; ctx.fillText("réf. " + x.ref, pad, y + 24, W - pad*2 - 200); }
        ctx.textAlign = "right"; ctx.fillStyle = INK; ctx.font = (hl ? "700 " : "400 ") + "23px " + SAN; ctx.fillText(cm(num(x.amount)), W - pad, y);
        y += h2;
      });
      dash(y - 22); y += 10;
      row("Total payé", cm(paid), true);
      ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = "700 26px " + SER; ctx.fillText("Reste à payer", pad, y + 4);
      ctx.textAlign = "right"; ctx.fillStyle = bal > 0 ? "#b5482a" : "#1f7a4d"; ctx.font = "700 32px " + SAN;
      ctx.fillText(bal > 0 ? cm(bal) : "SOLDÉ", W - pad, y + 6);
      y += 64;

      ctx.textAlign = "center"; ctx.fillStyle = INK; ctx.font = "italic 22px " + SER; ctx.fillText("Merci de votre confiance.", W/2, y); y += 30;
      var who = [p.name, p.shop].filter(Boolean).join(", ");
      if(who){ ctx.fillStyle = MUTED; ctx.font = "400 19px " + SAN; ctx.fillText("— " + who, W/2, y); y += 26; }
      ctx.fillStyle = "#a89c86"; ctx.font = "400 15px " + SAN; ctx.fillText("Reçu créé avec Fil d'Or", W/2, y + 14);
      return y + 44;
    }
    var tmp = document.createElement("canvas"); tmp.width = W; tmp.height = 10;
    var H = Math.ceil(paint(tmp.getContext("2d"), 0));
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    paint(cv.getContext("2d"), H);
    return cv;
  });
}
function receiptModal(o, pm){
  var box = h("div",{}, h("p",{class:"note",text:"Préparation du reçu…"}));
  modal(pm ? "Reçu de paiement" : "Reçu de la commande", box);
  receiptCanvas(o, pm).then(function(cv){
    cv.toBlob(function(blob){
      if(!blob){ box.innerHTML = ""; box.appendChild(h("p",{class:"note",text:"Impossible de créer l'image."})); return; }
      var c = clientOf(o.clientId);
      var name = "recu-" + orderNo(o) + (pm ? "-" + (o.payments.indexOf(pm) + 1) : "") + ".png";
      var file = null; try{ file = new File([blob], name, {type:"image/png"}); }catch(e){}
      var url = URL.createObjectURL(blob);
      var text = "Bonjour " + (c ? c.name : "") + ", voici votre reçu" + (pm ? " pour le paiement de " + cm(num(pm.amount)) : "") + ". " +
                 (balanceOf(o) > 0 ? "Reste à payer : " + cm(balanceOf(o)) + "." : "Votre commande est entièrement payée.") + sig();
      box.innerHTML = "";
      box.appendChild(h("img",{class:"rimg",src:url,alt:"Reçu"}));
      var row = h("div",{class:"row"});
      var canShare = !!(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share);
      if(canShare){
        row.appendChild(h("button",{class:"primary",type:"button",text:"Envoyer par WhatsApp…",onclick:function(){
          navigator.share({files:[file], text:text}).catch(function(){});
        }}));
      } else if(c && c.phone){
        row.appendChild(h("a",{class:"btn wa",target:"_blank",rel:"noopener",href:waLink(c.phone, text, state.settings.cc),text:"Ouvrir WhatsApp"}));
      }
      row.appendChild(h("a",{class:"btn",href:url,download:name,text:"Enregistrer l'image"}));
      box.appendChild(row);
      box.appendChild(h("p",{class:"note",text: canShare
        ? "Choisissez WhatsApp dans la liste, puis le contact du client. L'image du reçu part avec le message."
        : "Enregistrez l'image, puis joignez-la dans la conversation WhatsApp du client."}));
    }, "image/png");
  }).catch(function(){ box.innerHTML = ""; box.appendChild(h("p",{class:"note",text:"Impossible de créer l'image."})); });
}

/* ---------- Vue Clients ---------- */
function viewClients(){
  var root = h("div");
  var q = h("input",{placeholder:"Rechercher un client",value:ui.q});
  q.addEventListener("input", function(){ ui.q = q.value; renderList(); });
  root.appendChild(q);
  root.appendChild(h("div",{class:"row"}, h("button",{class:"primary",type:"button",text:"+ Nouveau client",onclick:function(){ clientModal(null); }})));
  var box = h("div",{class:"list",style:"margin-top:12px"});
  root.appendChild(box);
  function renderList(){
    box.innerHTML = "";
    var term = ui.q.trim().toLowerCase();
    var cs = state.clients.filter(function(c){ return !term || c.name.toLowerCase().indexOf(term) >= 0 || (c.phone||"").indexOf(term) >= 0; })
      .sort(function(a,b){ return a.name.localeCompare(b.name,"fr"); });
    if(!cs.length){ box.appendChild(h("div",{class:"empty",text: state.clients.length ? "Aucun résultat." : "Aucun client enregistré."})); return; }
    cs.forEach(function(c){
      var n = state.orders.filter(function(o){ return o.clientId === c.id; }).length;
      box.appendChild(h("div",{class:"item",onclick:function(){ clientModal(c.id); }},
        h("div",{class:"ibody"},
          h("div",{class:"r1"}, h("span",{class:"who",text:c.name}), h("span",{class:"tag neutral",text:n+" commande"+(n>1?"s":"")})),
          h("div",{class:"r2",text:c.phone || "Pas de téléphone"})
        )
      ));
    });
  }
  renderList();
  return root;
}

function clientModal(id){
  var c = id ? clientOf(id) : {id:uid(), name:"", phone:"", m:{}, notes:""};
  var isNew = !id;
  var name = h("input",{value:c.name,placeholder:"Nom"});
  var phone = h("input",{value:c.phone,placeholder:"Téléphone",inputmode:"tel"});
  var fields = state.settings.fields.slice();
  Object.keys(c.m||{}).forEach(function(k){ if(fields.indexOf(k) < 0) fields.push(k); });
  var mInputs = {};
  var mGrid = h("div",{class:"grid2"});
  fields.forEach(function(f){
    var inp = J().unit ? h("input",{type:"number",min:"0",step:"any",inputmode:"decimal",value:(c.m && c.m[f]) || "",placeholder:"cm"})
                       : h("input",{type:"text",value:(c.m && c.m[f]) || "",placeholder:""});
    mInputs[f] = inp;
    mGrid.appendChild(h("div",{}, h("label",{text:f}), inp));
  });
  var notes = h("textarea",{placeholder:J().notesPh}); notes.value = c.notes || "";
  var body = h("div",{}, h("label",{text:"Nom"}), name, h("label",{text:"Téléphone"}), phone,
    h("div",{class:"sec",text:J().measTitle}), mGrid, h("label",{text:"Notes"}), notes);
  var row = h("div",{class:"row"});
  row.appendChild(h("button",{class:"primary",type:"button",text:"Enregistrer",onclick:function(){
    if(!name.value.trim()){ toast("Entrez le nom."); return; }
    c.name = name.value.trim(); c.phone = phone.value.trim(); c.notes = notes.value.trim();
    c.m = {}; Object.keys(mInputs).forEach(function(k){ if(mInputs[k].value !== "") c.m[k] = mInputs[k].value; });
    if(isNew) state.clients.push(c);
    save(); close(); render(); toast("Client enregistré.");
  }}));
  if(!isNew){
    row.appendChild(h("button",{type:"button",text:"Nouvelle commande",onclick:function(){ close(); newOrderModal(c.id); }}));
    if(c.phone) row.appendChild(h("a",{class:"btn wa",target:"_blank",rel:"noopener",href:waLink(c.phone,"Bonjour "+c.name+","+sig(),state.settings.cc),text:"WhatsApp"}));
    row.appendChild(h("button",{class:"danger",type:"button",text:"Supprimer",onclick:function(){
      var mine = state.orders.filter(function(o){ return o.clientId === c.id; });
      if(confirm("Supprimer ce client"+(mine.length ? " et ses "+mine.length+" commande(s)" : "")+" ?")){
        mine.forEach(function(o){ Object.keys(o.photos||{}).forEach(function(k){ removePhoto(o.photos[k]); }); (o.payments||[]).forEach(function(pm){ if(pm.shot) removePhoto(pm.shot); }); });
        state.clients = state.clients.filter(function(x){ return x.id !== c.id; });
        state.orders = state.orders.filter(function(o){ return o.clientId !== c.id; });
        save(); close(); render();
      }
    }}));
  }
  body.appendChild(row);
  var close = modal(isNew ? "Nouveau client" : c.name, body);
}

/* ---------- Réglages et sauvegarde ---------- */
function exportBackup(){
  var ids = photoIds(state.orders, state.profile);
  Promise.all(ids.map(function(id){
    return Promise.all([idbGet(id), idbGet(id+":t")]).then(function(r){ return {id:id, full:r[0], thumb:r[1]}; });
  })).then(function(list){
    var images = {};
    list.forEach(function(x){ if(x.full || x.thumb) images[x.id] = {full:x.full, thumb:x.thumb}; });
    var blob = new Blob([JSON.stringify({version:2, settings:state.settings, profile:state.profile, clients:state.clients, orders:state.orders, images:images})],{type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "fildor-sauvegarde-"+todayISO()+".json"; document.body.appendChild(a); a.click(); a.remove();
    toast("Sauvegarde exportée.");
  });
}
function importBackup(d){
  var imgs = d.images || {}, jobs = [];
  Object.keys(imgs).forEach(function(id){
    var x = imgs[id] || {};
    if(x.full) jobs.push(idbPut(id, x.full));
    if(x.thumb) jobs.push(idbPut(id+":t", x.thumb));
    thumbs[id] = x.thumb || x.full;
  });
  return Promise.all(jobs).then(function(){
    state.clients = d.clients; state.orders = d.orders;
    if(d.settings) state.settings = Object.assign(state.settings, d.settings);
    if(d.profile) state.profile = Object.assign(state.profile, d.profile);
    state.settings.theme = Object.assign({}, DEFAULT_THEME, state.settings.theme || {});
    state.settings.logo = Object.assign({type:"brand"}, state.settings.logo || {});
    applyTheme(); save(); render();
  });
}
function viewSettings(){
  var s = state.settings;
  var cc = h("input",{value:s.cc,inputmode:"numeric",placeholder:"Indicatif pays (ex. 243)"});
  var cur = h("select",{},
    h("option",{value:"XOF",text:"FCFA (XOF)"}), h("option",{value:"XAF",text:"FCFA (XAF)"}),
    h("option",{value:"CDF",text:"Franc congolais (CDF)"}), h("option",{value:"USD",text:"Dollar (USD)"}), h("option",{value:"EUR",text:"Euro (EUR)"}));
  cur.value = s.cur;
  var flds = h("textarea",{}); flds.value = s.fields.join(", ");
  var file = h("input",{type:"file",accept:"application/json",style:"display:none"});
  file.addEventListener("change", function(){
    var f = file.files && file.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.clients) || !Array.isArray(d.orders)) throw new Error("format");
        if(confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")){
          importBackup(d).then(function(){ toast("Sauvegarde restaurée."); });
        }
      }catch(e){ toast("Fichier de sauvegarde invalide."); }
    };
    r.readAsText(f);
  });
  return h("div",{},
    identitySection(),
    themeSection(),
    h("div",{class:"sec",text:"Préférences"}),
    h("label",{text:"Indicatif téléphonique du pays (pour WhatsApp)",style:"margin-top:0"}), cc,
    h("label",{text:"Monnaie"}), cur,
    h("label",{text:J().measLabel+" (séparés par des virgules)"}), flds,
    h("div",{class:"row"}, h("button",{class:"primary",type:"button",text:"Enregistrer les réglages",onclick:function(){
      s.cc = cc.value.replace(/\D/g,"") || "243"; s.cur = cur.value;
      var list = flds.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
      s.fields = list.length ? list : J().fields.slice();
      save(); render(); toast("Réglages enregistrés.");
    }})),
    appSection(),
    h("div",{class:"sec",text:"Sauvegarde"}),
    h("p",{class:"note",text:"Vos données et vos photos sont gardées sur ce téléphone seulement. Exportez-les régulièrement : si vous effacez les données du navigateur ou changez de téléphone, elles seront perdues."}),
    h("div",{class:"row"},
      h("button",{type:"button",text:"Exporter une sauvegarde",onclick:exportBackup}),
      h("button",{type:"button",text:"Importer une sauvegarde",onclick:function(){ file.click(); }}),
      file),
    h("div",{class:"row"},
      h("button",{type:"button",text:"Charger un exemple",onclick:loadDemo}),
      h("button",{class:"danger",type:"button",text:"Tout effacer",onclick:function(){
        if(confirm("Effacer toutes les données et photos de cet appareil ?")){
          photoIds(state.orders, state.profile).forEach(removePhoto);
          state.clients = []; state.orders = []; state.profile.photo = ""; state.profile.logoPhoto = ""; state.settings.logo = {type:"brand"}; save(); render();
        }
      }}))
  );
}

function loadDemo(){
  var t = todayISO(), d = J().demo, cs = [];
  d.clients.forEach(function(x){ var c = {id:uid(), name:x.name, phone:x.phone, m:Object.assign({}, x.m), notes:x.notes || ""}; cs.push(c); state.clients.push(c); });
  d.orders.forEach(function(x){
    state.orders.push({id:uid(), clientId:cs[x.c].id, desc:x.desc, price:x.price, due:addDays(t, x.due), status:x.status, created:t,
      payments:[{id:uid(), date:t, amount:x.paid, mode:x.mode, ref:x.ref || "", shot:""}], photos:{}});
  });
  save(); ui.tab = "orders"; render(); toast("Exemple chargé.");
}

/* ---------- Rendu général ---------- */
function render(){
  renderHeader();
  var view = document.getElementById("view"); view.innerHTML = "";
  document.getElementById("fab").style.display = ui.tab === "orders" ? "flex" : "none";
  [].forEach.call(document.querySelectorAll("#tabs button"), function(b){ b.classList.toggle("on", b.getAttribute("data-tab") === ui.tab); });
  view.appendChild(ui.tab === "orders" ? viewOrders() : ui.tab === "clients" ? viewClients() : ui.tab === "cash" ? viewCash() : viewSettings());
}
[].forEach.call(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click", function(){ ui.tab = b.getAttribute("data-tab"); render(); window.scrollTo(0,0); });
});
document.getElementById("fab").addEventListener("click", function(){ newOrderModal(); });

registerSW();
})();
